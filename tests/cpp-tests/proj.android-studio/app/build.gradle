apply plugin: 'com.android.application'
apply plugin: 'bugly'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.1"

    // 添加这些配置
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "org.cocos2dx.cpp_tests"
        minSdkVersion 21
        targetSdkVersion 30

        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=jni/Application.mk",
                        "APP_PLATFORM:=android-21",
                        "NDK_DEBUG=1",
                        "V=1"
                cppFlags "-std=c++14 -frtti -fexceptions",
                        "-Wno-c++11-narrowing",
                        "-g",           // 调试符号
                        "-O0",          // 禁用优化
                        "-DDEBUG=1",    // 调试宏
                        "-D_DEBUG=1"
                cFlags "-Wno-c++11-narrowing",
                        "-g",
                        "-O0",
                        "-DDEBUG=1",
                        "-D_DEBUG=1"
            }
            ndk {
                abiFilters "armeabi-v7a",'x86'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('jni/Android.mk').absolutePath
        }
    }

    packagingOptions {
        doNotStrip '**/*.so'  // 禁止剥离所有so文件的调试符号
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libcpp_tests.so'
        // 添加其他可能的库
        pickFirst '**/libcocos2d.so'
        pickFirst '**/libbugly.so'
    }

    // 如果需要，配置NDK版本
    ndkVersion "22.1.7171670"


    sourceSets.main {
        java.srcDir "src"
        res.srcDir "res"
        jniLibs.srcDir "libs"
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "assets"
    }

    signingConfigs {

       release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true    // 启用JNI调试
            minifyEnabled false
            externalNativeBuild {
                ndkBuild {
                    cppFlags "-g -O0 -DDEBUG=1"
                    cFlags "-g -O0 -DDEBUG=1"
                }
            }
        }

        release {
            debuggable true
            jniDebuggable true    // 启用JNI调试
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            externalNativeBuild {
                ndkBuild {
                    cppFlags "-g -O1"  // 保留调试符号，但使用O1优化
                    cFlags "-g -O1"
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libcocos2dx')
    implementation 'com.tencent.bugly:crashreport:3.4.4' // 兼容版本
    // 如果需要 Native 崩溃监控
    implementation 'com.tencent.bugly:nativecrashreport:3.9.0'
}

bugly {
    appId = "7cedd98b5b" // 例如 "e9a0000f0f"
   appKey = "d5fc4924-b9c0-41e1-9857-42e0218398df" // 可选，在"设置"->"应用信息"中查看
   //version = "1.0.0" // 指定版本号，默认为当前版本
   execute = true // 设置为 true，表示允许插件在构建时执行
   upload = true // 设置为 true，表示允许插件上传符号表
}
