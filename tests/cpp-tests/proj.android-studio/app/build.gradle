apply plugin: 'com.android.application'
apply plugin: 'bugly'
android
{
    compileSdkVersion 28

    defaultConfig
            {
                applicationId "com.cocos.test"
                minSdkVersion 21
                targetSdkVersion 28
                versionCode 1
                versionName "9.9.9.9999.999"
                externalNativeBuild
                        {
                            ndkBuild
                                    {
                                        arguments "NDK_APPLICATION_MK:=jni/Application.mk",
                                                "APP_PLATFORM:=android-21",
                                                "NDK_DEBUG=1",
                                                "V=1"
                                        cppFlags "-std=c++14 -frtti -fexceptions",
                                                "-Wno-c++11-narrowing",
                                                "-g",           // 调试符号
                                                "-O0",          // 禁用优化
                                                "-DDEBUG=1",    // 调试宏
                                                "-D_DEBUG=1"
                                        cFlags "-Wno-c++11-narrowing",
                                                "-g",
                                                "-O0",
                                                "-DDEBUG=1",
                                                "-D_DEBUG=1"
                                    }
                            ndk
                                    {
                                        //设置支持的SO库架构
                                        abiFilters 'x86', 'armeabi-v7a'
                                    }
                        }
            }

    externalNativeBuild
            {
                ndkBuild
                {
                    path file('jni/Android.mk').absolutePath
                }
            }

    signingConfigs
            {
                debug {
                    storeFile file("../tempkeystore.jks")
                    storePassword "20190107"
                    keyAlias "key0"
                    keyPassword "20190107"
                }
                release {
                    storeFile file("../tempkeystore.jks")
                    storePassword "20190107"
                    keyAlias "key0"
                    keyPassword "20190107"
                }
            }
    buildTypes
            {
                release
                        {
                            // 开启混淆
                            signingConfig signingConfigs.release
                            minifyEnabled true
                            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                        }

                debug
                        {
                            // 开启混淆
                            signingConfig signingConfigs.debug
                            minifyEnabled true
                            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                        }
             }
    sourceSets.main
            {
                java.srcDir "src"
                res.srcDir "res"
                jniLibs.srcDir "libs"
                manifest.srcFile "AndroidManifest.xml"
                // === 修正这行 ===
                assets.srcDirs = ['../../Resources', 'src/main/assets']
            }

    // 如果需要，配置NDK版本
    ndkVersion "22.1.7171670"
}

dependencies
{
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libcocos2dx')
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    // 其中latest.release指代最新版本号，也可以指定明确的版本号，例如1.2.7
    // (注：从2.1.5开始要分开Bugly SDK和NDK的配置）
    implementation 'com.tencent.bugly:crashreport:3.3.3'
    implementation 'com.tencent.bugly:nativecrashreport:3.7.7'

    implementation "com.tencent.shiply:shiplyintegration:$shiply_integration_version"

    implementation "com.tencent.shiply:rdelivery:$rdelivery_version"

    implementation "com.tencent.shiply:reshub-sdk:$reshub_version"       // ResHub核心SDK
    implementation "com.tencent.shiply:reshub-net:$reshub_version"       // 可选，默认网络下载实现
    implementation "com.tencent.shiply:reshub-report:$reshub_version"    // 可选，默认上报SDK
    implementation "com.tencent.shiply:reshub-patch-sdk:$reshub_version" // 可选，差量更新SDK

    implementation("com.tencent.shiply:upgrade:$upgrade_version")
    implementation("com.tencent.shiply:upgrade-ui:$upgrade_version")
    implementation("com.tencent.shiply:upgrade-diff-pkg-patch:$upgrade_version")
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// 接入RFix补丁组件
apply from: rootProject.file('gradle/android-rfix-integration.gradle')
apply from: rootProject.file('gradle/android-auto-backup.gradle')